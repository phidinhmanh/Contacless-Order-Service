# .pre-commit-config.yaml
# ──────────────────────────────────────────────────────────────
# Recommended modern setup for FastAPI / Python projects (2025–2026)
# ──────────────────────────────────────────────────────────────

default_install_hook_types: [pre-commit, pre-push]   # optional: also run on push

repos:
  # ────────────────────────────────────────────────
  # Fast & general hygiene checks
  # ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0  # check latest at https://github.com/pre-commit/pre-commit-hooks/releases
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]           # warn on files > 500 KB
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-case-conflict      # Windows/macOS case-sensitivity issues

  # ────────────────────────────────────────────────
  # Ruff — the one tool to rule them all (2025 standard)
  # formatting + linting + isort + many Flake8 rules
  # ────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2   # update frequently → pre-commit autoupdate
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]   # auto-fix + block commit if still issues
      - id: ruff-format                             # black-compatible formatting

  # ────────────────────────────────────────────────
  # mypy — static type checking (strongly recommended for FastAPI)
  # ────────────────────────────────────────────────
  - repo: https://github.com/allganize/ty-pre-commit
    rev: v0.0.17
    hooks:
      - id: ty-check
        additional_dependencies: [
          "fastapi",
          "sqlalchemy",
          "pydantic",
          "alembic",
          "pytest",
          "python-dotenv",
          "httpx",
          "pytz",
          "qrcode"
        ]

  # ────────────────────────────────────────────────
  # Security scanner (optional but useful for APIs)
  # ────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0    # or latest
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        # or use --config bandit.yaml if you have one

# Optional extras you can add later
# ────────────────────────────────────────────────
# - repo: https://github.com/astral-sh/ty-pre-commit   (if/when ty gets official hook)
# - repo: https://github.com/commitizen-tools/commitizen
#   hooks:
#     - id: commitizen   # conventional commits
