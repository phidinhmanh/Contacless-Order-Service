services:
  db:
    image: postgres:15-alpine
    container_name: contacless-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contacless_order
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile # Assuming this is in the root
    container_name: contacless-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/contacless_order
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static:/app/static

frontend:
  build:
    context: ./frontend
    dockerfile: Dockerfile
    args:
      - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://localhost:8000}
  container_name: contacless-frontend
  restart: unless-stopped
  ports:
    - "3000:3000"
  environment:
    - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
  depends_on:
    - backend

volumes:
  postgres_data:
