version: "3.9"

services:
  # ============ POSTGRES DATABASE ============
  db:
    image: postgres:16-alpine
    container_name: ${APP_NAME:-contacless}_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-contacless_order}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-contacless_order}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ============ FASTAPI BACKEND ============
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-contacless}_backend
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-contacless_order}
      - VIETQR_BANK_ID=${VIETQR_BANK_ID:-}
      - VIETQR_ACCOUNT_NO=${VIETQR_ACCOUNT_NO:-}
      - VIETQR_ACCOUNT_NAME=${VIETQR_ACCOUNT_NAME:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ============ NEXT.JS FRONTEND ============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-contacless}_frontend
    environment:
      - NEXT_PUBLIC_API_URL=
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  # ============ NGINX REVERSE PROXY ============
  nginx:
    image: nginx:alpine
    container_name: ${APP_NAME:-contacless}_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
  # ============ CLOUDFLARE TUNNEL (OPTIONAL) ============
  # Uncomment this service to enable public HTTPS access
  # See docs/cloudflare-tunnel-setup.md for setup instructions
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: ${APP_NAME:-contacless}_tunnel
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - nginx
  #   restart: unless-stopped

volumes:
  data:
  postgres_data:
