version: "3.9"

services:
  # ============ FASTAPI BACKEND ============
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-contacless}_backend
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/contacless_order
      - VIETQR_BANK_ID=${VIETQR_BANK_ID:-}
      - VIETQR_ACCOUNT_NO=${VIETQR_ACCOUNT_NO:-}
      - VIETQR_ACCOUNT_NAME=${VIETQR_ACCOUNT_NAME:-}
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ============ NEXT.JS FRONTEND ============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-contacless}_frontend
    environment:
      - NEXT_PUBLIC_API_URL=
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  # ============ NGINX REVERSE PROXY ============
  nginx:
    image: nginx:alpine
    container_name: ${APP_NAME:-contacless}_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
  # ============ CLOUDFLARE TUNNEL (OPTIONAL) ============
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: ${APP_NAME:-contacless}_tunnel
  #   command: tunnel --url http://nginx:80
  #   depends_on:
  #     - nginx
  #   restart: unless-stopped

volumes:
  data:
