[project]
name = "contacless-order-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.38.0",
    "sqlalchemy>=2.0.44",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.10.0",
    "alembic>=1.15.0",
    "python-multipart>=0.0.20",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "websockets>=12.0",
    "openpyxl>=3.1.0",
    "qrcode>=8.2",
    "pillow>=12.1.0",
    "pytz>=2024.1",
    "httpx>=0.28.1",
    "requests>=2.32.5",
    "types-openpyxl>=3.1.5.20250919",
    "types-qrcode>=8.2.0.20250914",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.6",
    "bandit>=1.7.5",
    "pylint>=3.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "pre-commit>=3.6.0",
]

[tool.ruff.lint]
# 1. Enable flake8-bugbear (`B`) rules, in addition to the defaults.
select = ["E4", "E7", "E9", "F", "B"]

# 2. Avoid enforcing line-length violations (`E501`)
ignore = ["E501"]

# 3. Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# 4. Ignore `E402` (import violations) in all `__init__.py` files, and in selected subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.ruff.format]
# 5. Use single quotes in `ruff format`.
quote-style = "single"


[tool.ty.src]
include = ["app"]
exclude = [".venv", "alembic"]
[tool.ty.rules]
index-out-of-bounds = "ignore"

[tool.ty.environment]
root = ["."]

# mypy configuration - ignore SQLAlchemy Column type issues
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "passlib.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "jose.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pytz.*"
ignore_errors = true

# Bandit (security)
[tool.bandit]
skips = ["B106", "B107"]
exclude_dirs = ["tests", "venv", ".venv", "scripts"]

# Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

# Coverage
[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__init__.py"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
]
